<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My MBA Quiz Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="light-mode">
  <div id="app">
    <aside class="sidebar">
      <div class="logo">My MBA Quiz</div>

      <div class="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Search questions/concepts..."
        />
      </div>

      <div class="subject-list" id="subject-list"></div>
      <div class="topic-list" id="topic-list"></div>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="header-controls">
          <button id="mode-toggle" class="mode-toggle">Dark Mode</button>
        </div>
      </header>

      <section class="quiz-container">
        <div class="quiz-header">
          <div class="question-meta">
            <span id="question-counter"></span>
            <span id="question-type-label" class="badge"></span>
            <span id="question-origin-label" class="badge badge-secondary"></span>
          </div>
          <div class="progress-wrapper">
            <div id="progress-bar-bg" class="progress-bar-bg">
              <div id="progress-bar-fill" class="progress-bar-fill"></div>
            </div>
            <div class="score-meta">
              <span id="score-summary"></span>
            </div>
          </div>
        </div>

        <div class="question-body">
          <div id="question-text" class="question-text"></div>
          <ul id="options-list" class="options-list"></ul>

          <div class="question-controls">
            <button id="mark-btn" class="secondary-btn">Mark for Review</button>
            <div class="nav-controls">
              <button id="prev-btn" class="secondary-btn">Previous</button>
              <button id="submit-btn" class="primary-btn">Submit</button>
              <button id="next-btn" class="primary-btn">Next</button>
            </div>
          </div>

          <div id="feedback-panel" class="feedback-panel hidden">
            <div id="answer-status" class="answer-status"></div>
            <div id="correct-answer" class="correct-answer"></div>

            <div id="quick-explanation" class="quick-explanation"></div>

            <div class="deep-explanation-toggle">
              <button id="deep-toggle-btn" class="link-btn">
                Show Deep Explanation
              </button>
            </div>

            <div id="deep-explanation" class="deep-explanation hidden"></div>

            <div id="generated-questions-container" class="generated-questions"></div>
          </div>
        </div>

        <footer class="quiz-footer">
          <div class="footer-left">
            <button id="restart-topic-btn" class="secondary-btn">Restart Topic</button>
            <button id="shuffle-btn" class="secondary-btn">Randomize</button>
          </div>
          <div class="footer-right">
            <button id="review-incorrect-btn" class="secondary-btn">
              Review Incorrect
            </button>
            <button id="review-marked-btn" class="secondary-btn">
              Review Marked
            </button>
          </div>
        </footer>
      </section>

      <div id="summary-modal" class="modal hidden">
        <div class="modal-content">
          <h2>Quiz Summary</h2>
          <p id="summary-text"></p>
          <div id="topic-performance"></div>
          <div class="modal-actions">
            <button id="retry-topic-btn" class="primary-btn">Retry Topic</button>
            <button id="retry-incorrect-btn" class="secondary-btn">
              Retry Incorrect Only
            </button>
            <button id="close-summary-btn" class="secondary-btn">Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="quizData.js"></script>
  <script src="app.js"></script>
</body>
</html>
